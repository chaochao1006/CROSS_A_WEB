name: Supertrend Monitor

on:
  schedule:
    # 10:17 UTC = 18:17 Beijing time, after A-share and HK closes.
    - cron: "17 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: supertrend-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify Supertrend calculation
        run: python -m unittest discover -s tests -v

      - name: Run Supertrend and SMC monitors
        run: python run_monitor.py

      - name: Commit updated data
        if: ${{ always() && !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history.json
          if [ -d data/smc ]; then
            git add data/smc/latest.json data/smc/history.json
          fi
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update Supertrend monitor data"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
